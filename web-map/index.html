<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Геоінформаційний портал об'єктів громади</title>
    
    <!-- Підключення стилів бібліотеки Leaflet -->
    <link 
        rel="stylesheet" 
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
        crossorigin="" 
    />
    
    <!-- Кастомні стилі проєкту -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header-container">
        <h1>Інтерактивна карта об'єктів місцевої громади</h1>
        <p>Демонстраційний прототип системи візуалізації просторових даних</p>
    </div>

    <!-- Контейнер для рендерингу карти -->
    <div id="map"></div>

    <!-- Модуль бібліотеки Leaflet -->
    <script 
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" 
        crossorigin="">
    </script>
    
    <!-- Логіка карти та об'єктів -->
    <script src="script.js"></script>
</body>
</html>
